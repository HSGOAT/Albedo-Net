name: Audit qualite dataset & coherence des seuils

on:
  push:
    paths:
      - "datasets/materials_v1.parquet"
      - "build_training_dataset.py"
      - "train_material_classifier.py"
      - "config.py"
      - "heat_island_calibration.py"
      - "confidence.py"
      - "materials.py"
      - "shadow_calibration.py"
      - "city_registry.py"
      - "tests/**"
  pull_request:
    paths:
      - "datasets/materials_v1.parquet"
      - "build_training_dataset.py"
      - "train_material_classifier.py"
      - "config.py"
      - "heat_island_calibration.py"
      - "confidence.py"
      - "materials.py"
      - "shadow_calibration.py"
      - "city_registry.py"
      - "tests/**"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          # requirements-ci.txt est un sous-ensemble STRICT de
          # requirements.txt (source de verite des versions), limite a ce
          # que tests/ importe reellement -- volontairement SANS
          # geopandas/rasterio/shapely/pyproj (dependent de GDAL, absent
          # par defaut sur ce runner, et non necessaires pour ces tests).
          # torch installe d'abord via l'index CPU-only (plus leger/rapide
          # en CI, inutile d'avoir le support GPU ici car AlbedoPredictor
          # tourne explicitement en device="cpu").
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Lancer tous les audits (etancheite splits + coherence seuils/cles)
        run: pytest tests/ -v
